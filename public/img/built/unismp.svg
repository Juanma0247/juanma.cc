<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4fb5"/>
      <stop offset="100%" stop-color="#9b6bf5"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4c8f0"/>
      <stop offset="50%" stop-color="#b8aed4"/>
      <stop offset="100%" stop-color="#9b8ec8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(16,16)" filter="url(#glow)">
    <rect x="-10" y="-10" width="20" height="20" rx="1" transform="rotate(45)" fill="none" stroke="url(#frame)" stroke-width="1.8" opacity="0.9"/>
    <rect x="-7.5" y="-7.5" width="15" height="15" rx="0.5" transform="rotate(45)" fill="none" stroke="url(#frame)" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="url(#frame)" stroke-width="0.6" opacity="0.4"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="url(#frame)" stroke-width="0.6" opacity="0.4"/>
  </g>
  <g transform="translate(16,16)" filter="url(#coreGlow)">
    <rect x="-4.5" y="-4.5" width="9" height="9" rx="0.5" transform="rotate(45)" fill="url(#core)" opacity="0.95"/>
  </g>
</svg>
