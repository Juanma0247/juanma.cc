<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 210">
  <defs>
    <style>
      .t { font-family: Georgia, 'Times New Roman', serif; }
      .m { font-family: 'Courier New', monospace; }
      .b { font-family: Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="190" height="210" fill="#ffffff"/>

  <!-- Top accent bar -->
  <rect width="190" height="4" fill="#008888"/>

  <!-- Formula header -->
  <rect x="10" y="12" width="170" height="26" rx="4" fill="#f0fafa"/>
  <text x="95" y="29" class="t" font-size="13" fill="#008888" text-anchor="middle" font-style="italic">T = (K, q₀, I)</text>

  <!-- Tape label -->
  <text x="12" y="57" class="b" font-size="9" fill="#888" letter-spacing="1">TAPE</text>
  <line x1="10" y1="60" x2="180" y2="60" stroke="#008888" stroke-width=".6" stroke-opacity=".3"/>

  <!-- Tape cells: 9 cells, head at index 4 (center) -->
  <!-- x positions: 10, 30, 50, 70, 90, 110, 130, 150, 170 — w=20, h=22, y=65 -->
  <!-- Blanks -->
  <rect x="10"  y="65" width="20" height="22" rx="2" fill="none" stroke="#bbb" stroke-width=".8"/>
  <rect x="30"  y="65" width="20" height="22" rx="2" fill="none" stroke="#bbb" stroke-width=".8"/>
  <!-- 1 0 1 active 1 0 1 -->
  <rect x="50"  y="65" width="20" height="22" rx="2" fill="none" stroke="#009" stroke-width=".8" stroke-opacity=".3"/>
  <rect x="70"  y="65" width="20" height="22" rx="2" fill="none" stroke="#009" stroke-width=".8" stroke-opacity=".3"/>
  <!-- Active cell -->
  <rect x="90"  y="63" width="20" height="26" rx="3" fill="#008888"/>
  <!-- Right cells -->
  <rect x="110" y="65" width="20" height="22" rx="2" fill="none" stroke="#009" stroke-width=".8" stroke-opacity=".3"/>
  <rect x="130" y="65" width="20" height="22" rx="2" fill="none" stroke="#009" stroke-width=".8" stroke-opacity=".3"/>
  <rect x="150" y="65" width="20" height="22" rx="2" fill="none" stroke="#bbb" stroke-width=".8"/>
  <rect x="170" y="65" width="20" height="22" rx="2" fill="none" stroke="#bbb" stroke-width=".8"/>

  <!-- Cell symbols -->
  <text x="20"  y="80" class="m" font-size="9" fill="#ccc" text-anchor="middle">_</text>
  <text x="40"  y="80" class="m" font-size="9" fill="#ccc" text-anchor="middle">_</text>
  <text x="60"  y="80" class="m" font-size="9" fill="#555" text-anchor="middle">1</text>
  <text x="80"  y="80" class="m" font-size="9" fill="#555" text-anchor="middle">0</text>
  <text x="100" y="80" class="m" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
  <text x="120" y="80" class="m" font-size="9" fill="#555" text-anchor="middle">0</text>
  <text x="140" y="80" class="m" font-size="9" fill="#555" text-anchor="middle">1</text>
  <text x="160" y="80" class="m" font-size="9" fill="#ccc" text-anchor="middle">_</text>
  <text x="180" y="80" class="m" font-size="9" fill="#ccc" text-anchor="middle">_</text>

  <!-- Reading head arrow + state -->
  <polygon points="100,96 95,91 105,91" fill="#008888"/>
  <circle cx="100" cy="107" r="9" fill="none" stroke="#008888" stroke-width="1.5"/>
  <text x="100" y="111" class="b" font-size="8" fill="#008888" text-anchor="middle">q₁</text>

  <!-- Position indices row -->
  <text x="20"  y="123" class="m" font-size="5.5" fill="#bbb" text-anchor="middle">−4</text>
  <text x="40"  y="123" class="m" font-size="5.5" fill="#bbb" text-anchor="middle">−3</text>
  <text x="60"  y="123" class="m" font-size="5.5" fill="#aaa" text-anchor="middle">−2</text>
  <text x="80"  y="123" class="m" font-size="5.5" fill="#aaa" text-anchor="middle">−1</text>
  <text x="100" y="123" class="m" font-size="6" fill="#008888" text-anchor="middle" font-weight="bold">0</text>
  <text x="120" y="123" class="m" font-size="5.5" fill="#aaa" text-anchor="middle">1</text>
  <text x="140" y="123" class="m" font-size="5.5" fill="#aaa" text-anchor="middle">2</text>
  <text x="160" y="123" class="m" font-size="5.5" fill="#bbb" text-anchor="middle">3</text>
  <text x="180" y="123" class="m" font-size="5.5" fill="#bbb" text-anchor="middle">4</text>

  <!-- Divider -->
  <line x1="10" y1="131" x2="180" y2="131" stroke="#008888" stroke-width=".5" stroke-opacity=".25"/>

  <!-- State diagram label -->
  <text x="12" y="142" class="b" font-size="9" fill="#888" letter-spacing="1">STATE DIAGRAM</text>

  <!-- State diagram: 3 states q0, q1, q2 in a line, y=165 -->
  <!-- q0 -->
  <circle cx="40"  cy="165" r="14" fill="none" stroke="#008888" stroke-width="1.4" stroke-opacity=".8"/>
  <text x="40"  y="169" class="b" font-size="8" fill="#008888" text-anchor="middle">q₀</text>
  <!-- init arrow -->
  <line x1="18" y1="165" x2="24" y2="165" stroke="#008888" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- q1 — active -->
  <circle cx="95"  cy="165" r="14" fill="#008888" stroke="#008888" stroke-width="1.4"/>
  <text x="95"  y="169" class="b" font-size="8" fill="#fff" text-anchor="middle">q₁</text>

  <!-- q2 -->
  <circle cx="150" cy="165" r="14" fill="none" stroke="#008888" stroke-width="1.4" stroke-opacity=".8"/>
  <text x="150" y="169" class="b" font-size="8" fill="#008888" text-anchor="middle">q₂</text>

  <!-- Arrows between states -->
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#008888" opacity=".85"/>
    </marker>
  </defs>
  <!-- q0 → q1 -->
  <path d="M55,160 Q67,150 79,160" fill="none" stroke="#008888" stroke-width="1.2" stroke-opacity=".8" marker-end="url(#a)"/>
  <text x="67" y="151" class="m" font-size="6.5" fill="#555" text-anchor="middle">1|aR</text>
  <!-- q1 → q2 -->
  <path d="M110,160 Q122,150 134,160" fill="none" stroke="#008888" stroke-width="1.2" stroke-opacity=".8" marker-end="url(#a)"/>
  <text x="122" y="151" class="m" font-size="6.5" fill="#555" text-anchor="middle">#|1L</text>
  <!-- self loop q1 -->
  <path d="M88,152 C88,138 102,138 102,152" fill="none" stroke="#008888" stroke-width="1.1" stroke-opacity=".6" marker-end="url(#a)"/>
  <text x="95" y="135" class="m" font-size="6" fill="#777" text-anchor="middle">0|0R</text>

  <!-- Bottom bar -->
  <rect y="200" width="190" height="10" fill="#008888" opacity=".08"/>
  <text x="95" y="207" class="b" font-size="7.5" fill="#008888" text-anchor="middle" letter-spacing=".5">TURING MACHINE LAB</text>
</svg>
